server {
    listen 80;
    server_name bookshop70.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bookshop70.ru;

    ssl_certificate /etc/letsencrypt/live/bookshop70.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookshop70.ru/privkey.pem;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
