events {}

http {
    server {
        listen 80;
        server_name bookshop70.ru www.bookshop70.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name bookshop70.ru www.bookshop70.ru;

        ssl_certificate /etc/letsencrypt/live/bookshop70.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bookshop70.ru/privkey.pem;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}