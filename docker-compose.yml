services:
  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
#    volumes:
#      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      - db
    command: >
      sh -c "while ! nc -z db 5432; do sleep 1; done;
             python manage.py migrate &&
             gunicorn bookshop.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    environment:
      - REACT_APP_API_URL=/api/
#    volumes:
#      - frontend_build:/app/build
#      - frontend_build:/usr/share/nginx/html
    ports:
      - "8002:80"
    depends_on:
      - backend

  db:
    image: postgres:14
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: bookshop
      POSTGRES_USER: postgres_bookshop
      POSTGRES_PASSWORD: postgres_bookshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"


#  nginx:
#    image: nginx:alpine
#    container_name: nginx
#    ports:
#      - "80:80"
#    volumes:
#      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
#    depends_on:
#      - frontend
#      - backend
#
volumes:
  postgres_data:
  frontend_build: