services:
  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
#    volumes:
#      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      - db
    command: >
      sh -c "while ! nc -z db 5432; do sleep 1; done;
             python manage.py migrate &&
             gunicorn bookshop.wsgi:application --bind 0.0.0.0:8000"

  db:
    image: postgres:14
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: bookshop
      POSTGRES_USER: postgres_bookshop
      POSTGRES_PASSWORD: postgres_bookshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data: