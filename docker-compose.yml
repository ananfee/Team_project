services:
  backend:
    build:
      context: ./backend
    container_name: backend
    volumes:
      - ./backend:/app
    expose:
      - 8000
    depends_on:
      - db
    command: >
      sh -c "while ! nc -z db 5432; do sleep 1; done;
             python manage.py migrate &&
             gunicorn bookshop.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      - backend

  localhost:
    image: postgres:14
    container_name: db
    environment:
      POSTGRES_DB: bookshop
      POSTGRES_USER: postgres_bookshop
      POSTGRES_PASSWORD: postgres_bookshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: